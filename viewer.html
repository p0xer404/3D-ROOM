<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Room Viewer</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,0.85);
    --surface-solid: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.13);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-light: rgba(0,113,227,0.09);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --success: #34c759;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 20px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text-primary);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  #app { display:flex; height:100vh; width:100vw; }
  #canvas-area { flex:1; position:relative; background:#e8e8ed; overflow:hidden; }
  canvas { display:block; }

  /* Sidebar */
  #sidebar {
    width: 292px; flex-shrink:0;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    border-right: 1px solid var(--border);
    display:flex; flex-direction:column;
    z-index:10; overflow:hidden;
  }
  .sb-top {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .app-label {
    font-size:10px; font-weight:600; letter-spacing:0.08em;
    color:var(--text-tertiary); text-transform:uppercase; margin-bottom:3px;
  }
  .app-title { font-size:19px; font-weight:600; letter-spacing:-0.4px; }

  .sb-section { padding:14px 20px; border-bottom:1px solid var(--border); }
  .section-label {
    font-size:10px; font-weight:600; letter-spacing:0.06em;
    color:var(--text-tertiary); text-transform:uppercase; margin-bottom:10px;
  }

  /* File buttons */
  .file-btn {
    display:flex; align-items:center; gap:10px;
    width:100%; padding:10px 12px;
    background:var(--surface-solid); border:1px solid var(--border-strong);
    border-radius:var(--radius-sm); cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
    font-family:inherit; text-align:left; margin-bottom:8px;
  }
  .file-btn:last-child { margin-bottom:0; }
  .file-btn:hover { background:#f9f9fb; border-color:rgba(0,0,0,0.18); }
  .file-btn.loaded { border-color:rgba(52,199,89,0.4); background:rgba(52,199,89,0.04); }
  .file-icon {
    width:32px; height:32px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0;
  }
  .file-icon.blue { background:rgba(0,113,227,0.09); }
  .file-icon.green { background:rgba(52,199,89,0.09); }
  .file-info { flex:1; min-width:0; }
  .file-info-name {
    font-size:13px; font-weight:500; color:var(--text-primary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .file-info-sub { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
  input[type="file"] { display:none; }

  /* Status dots */
  .status-row { display:flex; align-items:center; gap:6px; margin-top:10px; }
  .status-dot {
    width:6px; height:6px; border-radius:50%;
    background:var(--text-tertiary); flex-shrink:0;
    transition:background 0.3s;
  }
  .status-dot.on { background:var(--success); }
  .status-text { font-size:11px; color:var(--text-tertiary); }

  /* Hotspot panel (info card) */
  #info-panel {
    position:absolute; right:20px; top:50%; transform:translateY(-50%) translateX(8px);
    width:260px;
    background: rgba(255,255,255,0.9);
    backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none;
    transition: opacity 0.22s, transform 0.22s;
    z-index:20;
  }
  #info-panel.visible {
    opacity:1; pointer-events:all;
    transform:translateY(-50%) translateX(0);
  }
  .panel-close {
    position:absolute; top:12px; right:14px;
    background:none; border:none; color:var(--text-tertiary);
    font-size:18px; line-height:1; cursor:pointer;
    border-radius:4px; padding:2px 5px;
    transition:color 0.15s, background 0.15s;
  }
  .panel-close:hover { color:var(--text-primary); background:rgba(0,0,0,0.05); }
  .panel-tag {
    font-size:10px; font-weight:600; letter-spacing:0.06em;
    color:var(--text-tertiary); text-transform:uppercase; margin-bottom:5px;
  }
  .panel-label {
    font-size:17px; font-weight:600; letter-spacing:-0.3px;
    color:var(--text-primary); margin-bottom:14px; line-height:1.3;
    padding-right:20px;
  }
  .panel-items-title {
    font-size:10px; font-weight:600; letter-spacing:0.06em;
    color:var(--text-tertiary); text-transform:uppercase; margin-bottom:8px;
  }
  .panel-items { list-style:none; display:flex; flex-direction:column; gap:5px; }
  .panel-items li {
    font-size:13px; color:var(--text-secondary);
    padding:7px 10px;
    background:rgba(0,0,0,0.03);
    border-left:2px solid rgba(0,113,227,0.3);
    border-radius:0 5px 5px 0;
  }
  .panel-coords {
    margin-top:12px; padding-top:10px;
    border-top:1px solid var(--border);
    font-size:11px; color:var(--text-tertiary);
    font-variant-numeric:tabular-nums;
  }

  /* Hotspot count badge */
  #hs-count {
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-solid); border:1px solid var(--border);
    border-radius:20px; padding:5px 12px;
    font-size:12px; color:var(--text-secondary);
    box-shadow:var(--shadow); margin-top:10px;
  }
  #hs-count span { color:var(--accent); font-weight:600; }

  /* Drop overlay */
  #drop-overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background:#e8e8ed; z-index:5; transition:opacity 0.3s;
  }
  #drop-overlay.hidden { opacity:0; pointer-events:none; }
  .drop-icon {
    width:60px; height:60px; border-radius:16px;
    background:rgba(0,113,227,0.08);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; margin-bottom:4px;
  }
  .drop-title { font-size:17px; font-weight:600; letter-spacing:-0.3px; }
  .drop-sub { font-size:13px; color:var(--text-secondary); }

  /* Hotspot label overlays */
  .hs-label {
    position:absolute; pointer-events:none;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border:1px solid var(--border);
    border-radius:6px; padding:3px 9px;
    font-size:11px; font-weight:500; color:var(--text-primary);
    box-shadow:var(--shadow);
    transform:translate(-50%, -190%); white-space:nowrap;
    opacity:0; transition:opacity 0.2s;
  }

  /* HUD hint */
  #hint {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.88); backdrop-filter:blur(12px);
    border:1px solid var(--border); border-radius:20px;
    padding:6px 16px; font-size:12px; color:var(--text-secondary);
    box-shadow:var(--shadow); pointer-events:none; white-space:nowrap;
    transition:opacity 0.4s;
  }
</style>
</head>
<body>
<div id="app">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sb-top">
      <div class="app-label">Room Viewer</div>
      <div class="app-title">Mapa 3D</div>
    </div>

    <div class="sb-section">
      <div class="section-label">Fitxers</div>

      <label class="file-btn" id="btn-glb" for="file-glb">
        <div class="file-icon blue">📦</div>
        <div class="file-info">
          <div class="file-info-name" id="glb-name">Seleccionar room.glb</div>
          <div class="file-info-sub">Model 3D de la habitació</div>
        </div>
      </label>
      <input type="file" id="file-glb" accept=".glb,.gltf,model/gltf-binary,model/gltf+json,application/octet-stream">

      <label class="file-btn" id="btn-json" for="file-json">
        <div class="file-icon green">📍</div>
        <div class="file-info">
          <div class="file-info-name" id="json-name">Seleccionar hotspots.json</div>
          <div class="file-info-sub">Punts d'interès</div>
        </div>
      </label>
      <input type="file" id="file-json" accept=".json,application/json,text/plain">

      <div class="status-row">
        <div class="status-dot" id="dot-glb"></div>
        <div class="status-text" id="txt-glb">Model no carregat</div>
      </div>
      <div class="status-row">
        <div class="status-dot" id="dot-json"></div>
        <div class="status-text" id="txt-json">Hotspots no carregats</div>
      </div>
    </div>

    <div class="sb-section">
      <div class="section-label">Escena</div>
      <div id="hs-count"><span id="hs-n">0</span> hotspot(s) actiu(s)</div>
    </div>

    <!-- Hotspot list readonly -->
    <div style="flex:1;overflow-y:auto;padding:14px 20px;">
      <div class="section-label" style="margin-bottom:10px;">Índex</div>
      <div id="hs-index"></div>
    </div>
  </div>

  <!-- Canvas -->
  <div id="canvas-area">
    <div id="drop-overlay">
      <div class="drop-icon">🏠</div>
      <div class="drop-title">Cap model carregat</div>
      <div class="drop-sub">Carrega un .glb i un hotspots.json</div>
    </div>
    <div id="hint">Fes click en un hotspot per veure la informació</div>
  </div>

  <!-- Info panel -->
  <div id="info-panel">
    <button class="panel-close" id="panel-close">×</button>
    <div class="panel-tag">Hotspot</div>
    <div class="panel-label" id="panel-label">—</div>
    <div class="panel-items-title">Contingut</div>
    <ul class="panel-items" id="panel-items"></ul>
    <div class="panel-coords" id="panel-coords"></div>
  </div>

</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// State
let hotspotMeshes = [], modelMeshes = [], labelEls = [];
let glbLoaded = false, jsonLoaded = false;

const area = document.getElementById('canvas-area');
const W = () => area.offsetWidth, H = () => area.offsetHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
area.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e8ed);

const camera = new THREE.PerspectiveCamera(50, W()/H(), 0.01, 200);
camera.position.set(4, 3, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;

scene.add(new THREE.AmbientLight(0xffffff, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(6,10,6); sun.castShadow=true; scene.add(sun);
const fillLight = new THREE.DirectionalLight(0xd0e8ff, 0.5);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);
scene.add(new THREE.GridHelper(20, 40, 0xc8c8cc, 0xd8d8dc));

const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

// DOM
const $ = id => document.getElementById(id);
const fileGlb=$('file-glb'), fileJson=$('file-json');
const glbName=$('glb-name'), jsonName=$('json-name');
const dotGlb=$('dot-glb'), dotJson=$('dot-json');
const txtGlb=$('txt-glb'), txtJson=$('txt-json');
const btnGlb=$('btn-glb'), btnJson=$('btn-json');
const overlay=$('drop-overlay'), hint=$('hint');
const infoPanel=$('info-panel'), panelClose=$('panel-close');
const panelLabel=$('panel-label'), panelItems=$('panel-items'), panelCoords=$('panel-coords');
const hsN=$('hs-n'), hsIndex=$('hs-index');

panelClose.addEventListener('click', () => infoPanel.classList.remove('visible'));

function tryHideOverlay() {
  if (glbLoaded) overlay.classList.add('hidden');
}

// ── preprocessGLB ─────────────────────────────────────────────
// Converts a GLB ArrayBuffer into a GLTF JSON string with all embedded
// images and the binary buffer replaced by data URIs, so Three.js never
// needs to create or fetch blob: URLs (which fail in some environments).
async function preprocessGLB(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  let offset = 12, gltfJson = null, binBuffer = null;
  while (offset < arrayBuffer.byteLength) {
    const len  = view.getUint32(offset, true);
    const type = view.getUint32(offset + 4, true);
    const data = arrayBuffer.slice(offset + 8, offset + 8 + len);
    if      (type === 0x4E4F534A) gltfJson = JSON.parse(new TextDecoder().decode(data));
    else if (type === 0x004E4942) binBuffer = data;
    offset += 8 + len;
  }
  if (!gltfJson) throw new Error('GLB invàlid: no s\'ha trobat el chunk JSON');

  const toDataURL = (blob) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload  = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });

  // Convert each embedded image bufferView → data URI
  if (gltfJson.images && binBuffer) {
    gltfJson.images = await Promise.all(gltfJson.images.map(async img => {
      if (img.bufferView !== undefined) {
        const bv      = gltfJson.bufferViews[img.bufferView];
        const slice   = binBuffer.slice(bv.byteOffset || 0, (bv.byteOffset || 0) + bv.byteLength);
        const dataUrl = await toDataURL(new Blob([slice], { type: img.mimeType || 'image/jpeg' }));
        return { uri: dataUrl, mimeType: img.mimeType || 'image/jpeg' };
      }
      return img;
    }));
  }

  // Convert main binary buffer → data URI so Three.js doesn't fetch it
  if (binBuffer && gltfJson.buffers?.[0]) {
    gltfJson.buffers[0].uri = await toDataURL(
      new Blob([binBuffer], { type: 'application/octet-stream' })
    );
  }

  return JSON.stringify(gltfJson);
}

// ── Load GLB ──────────────────────────────────────────────────
fileGlb.addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  glbName.textContent = file.name;
  btnGlb.classList.add('loaded');
  scene.children.filter(c => c.userData.isModel).forEach(c => scene.remove(c));
  modelMeshes = [];
  try {
    const arrayBuffer = await file.arrayBuffer();
    const gltfString  = await preprocessGLB(arrayBuffer);
    new GLTFLoader().parse(gltfString, '', gltf => {
      const model = gltf.scene; model.userData.isModel = true;
      model.traverse(c => {
        if (c.isMesh) { c.castShadow=true; c.receiveShadow=true; modelMeshes.push(c); }
      });
      const box    = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      model.scale.setScalar(5 / Math.max(size.x, size.y, size.z));
      scene.add(model);
      camera.position.set(5,4,6); controls.target.set(0,0,0); controls.update();
      glbLoaded = true;
      dotGlb.classList.add('on'); txtGlb.textContent = `${file.name} carregat`;
      tryHideOverlay();
    }, err => {
      glbName.textContent = 'Seleccionar room.glb';
      btnGlb.classList.remove('loaded');
      dotGlb.classList.remove('on'); txtGlb.textContent = 'Error carregant el model';
      console.error(err);
    });
  } catch(err) {
    glbName.textContent = 'Seleccionar room.glb';
    btnGlb.classList.remove('loaded');
    dotGlb.classList.remove('on'); txtGlb.textContent = 'Error llegint el fitxer';
    console.error(err);
  }
});

// ── Load JSON ─────────────────────────────────────────────────
fileJson.addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  jsonName.textContent = file.name;
  btnJson.classList.add('loaded');
  const reader = new FileReader();
  reader.onload = ev => {
    let data;
    try { data = JSON.parse(ev.target.result); } catch { alert('JSON invàlid'); return; }
    // Remove old hotspots
    hotspotMeshes.forEach(h => { scene.remove(h.mesh); scene.remove(h.ring); });
    labelEls.forEach(l => l.el.remove());
    hotspotMeshes = []; labelEls = [];

    const geo  = new THREE.SphereGeometry(0.045, 20, 20);
    const rGeo = new THREE.RingGeometry(0.07, 0.1, 32);

    data.forEach((hs, i) => {
      const [x,y,z] = hs.position;

      const mat = new THREE.MeshPhongMaterial({
        color:0x0071e3, emissive:0x003a80, emissiveIntensity:0.3,
        transparent:true, opacity:0.92
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x,y,z); mesh.userData = hs; scene.add(mesh);

      const rMat = new THREE.MeshBasicMaterial({
        color:0x0071e3, side:THREE.DoubleSide,
        transparent:true, opacity:0.25
      });
      const ring = new THREE.Mesh(rGeo, rMat);
      ring.rotation.x = -Math.PI/2; ring.position.set(x,y,z); scene.add(ring);

      const el = document.createElement('div');
      el.className='hs-label'; el.textContent=hs.label;
      area.appendChild(el);
      labelEls.push({ mesh, el });

      hotspotMeshes.push({ mesh, ring, data: hs, idx: i });
    });

    jsonLoaded = true;
    dotJson.classList.add('on'); txtJson.textContent = `${data.length} hotspot(s) carregat(s)`;
    hsN.textContent = data.length;
    renderIndex(data);
    hint.style.opacity = '1';
  };
  reader.readAsText(file);
});

function renderIndex(data) {
  hsIndex.innerHTML = data.map((hs,i) => `
    <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;
      background:var(--surface-solid);border:1px solid var(--border);
      border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;"
      data-i="${i}">
      <div style="width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:0.7;"></div>
      <div>
        <div style="font-size:13px;font-weight:500;">${hs.label}</div>
        <div style="font-size:11px;color:var(--text-tertiary);margin-top:1px;">${hs.id}</div>
      </div>
    </div>
  `).join('');
  hsIndex.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('click', () => openPanel(data[+el.dataset.i]));
    el.addEventListener('mouseenter', () => { el.style.borderColor='rgba(0,113,227,0.3)'; });
    el.addEventListener('mouseleave', () => { el.style.borderColor=''; });
  });
}

// ── Click on hotspot ──────────────────────────────────────────
let mdPos={x:0,y:0};
renderer.domElement.addEventListener('mousedown', e => { mdPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('mouseup', e => {
  if (Math.hypot(e.clientX-mdPos.x,e.clientY-mdPos.y)>5 || !hotspotMeshes.length) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
  if (hits.length) openPanel(hits[0].object.userData);
});

function openPanel(hs) {
  panelLabel.textContent = hs.label;
  panelItems.innerHTML = (hs.items||[]).map(i=>`<li>${i}</li>`).join('');
  panelCoords.textContent = `id: ${hs.id} · [${hs.position.join(', ')}]`;
  infoPanel.classList.add('visible');
}

// Hover cursor
renderer.domElement.addEventListener('mousemove', e => {
  if (!hotspotMeshes.length) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(hotspotMeshes.map(h=>h.mesh));
  renderer.domElement.style.cursor = hits.length ? 'pointer' : 'default';
});

// Labels
function updateLabels() {
  labelEls.forEach(({mesh,el}) => {
    const pos = mesh.position.clone().project(camera);
    el.style.left = (pos.x*.5+.5)*W()+'px';
    el.style.top  = (-pos.y*.5+.5)*H()+'px';
    el.style.opacity = pos.z < 1 ? '1' : '0';
  });
}

window.addEventListener('resize', () => {
  camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H());
});

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  hotspotMeshes.forEach(({mesh,ring},i) => {
    mesh.position.y += Math.sin(t*1.5+i*1.1)*0.0004;
    ring.rotation.z = t*0.4+i;
    ring.material.opacity = 0.15 + 0.1*Math.sin(t*2+i);
  });
  controls.update(); updateLabels(); renderer.render(scene,camera);
})();
</script>
</body>
</html>
