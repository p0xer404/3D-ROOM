<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<title>Room Editor</title>
<style>
  :root {
    --bg: #f5f5f7;
    --surface: rgba(255,255,255,0.85);
    --surface-solid: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.13);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --accent-light: rgba(0,113,227,0.09);
    --text-primary: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #aeaeb2;
    --danger: #ff3b30;
    --success: #34c759;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 20px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Layout */
  #app { display:flex; height:100vh; width:100vw; }

  #sidebar {
    width: 292px; flex-shrink: 0;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(1.8);
    -webkit-backdrop-filter: blur(24px) saturate(1.8);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 10; overflow: hidden;
  }

  #canvas-area {
    flex:1; position:relative;
    background: #e8e8ed; overflow:hidden;
  }
  canvas { display:block; }

  /* Sidebar sections */
  .sb-top {
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .app-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em; color: var(--text-tertiary);
    text-transform: uppercase; margin-bottom: 3px;
  }
  .app-title {
    font-size: 19px; font-weight: 600;
    letter-spacing: -0.4px; color: var(--text-primary);
  }

  .sb-section {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .section-label {
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.06em; color: var(--text-tertiary);
    text-transform: uppercase; margin-bottom: 10px;
  }

  /* File button */
  .file-btn {
    display:flex; align-items:center; gap:10px;
    width:100%; padding:10px 12px;
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    cursor:pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit; text-align:left;
  }
  .file-btn:hover { background: #f9f9fb; border-color: rgba(0,0,0,0.18); }
  .file-icon {
    width:32px; height:32px;
    background: var(--accent-light); border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; flex-shrink:0;
  }
  .file-info { flex:1; min-width:0; }
  .file-info-name {
    font-size:13px; font-weight:500; color:var(--text-primary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .file-info-sub { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
  input[type="file"] { display:none; }

  /* Coord cards */
  .coord-group { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
  .coord-card {
    background: var(--surface-solid); border:1px solid var(--border);
    border-radius: var(--radius-sm); padding:8px 10px; text-align:center;
  }
  .coord-axis {
    font-size:10px; font-weight:600; color:var(--text-tertiary);
    letter-spacing:0.06em; text-transform:uppercase; margin-bottom:3px;
  }
  .coord-val {
    font-size:13px; font-weight:500; color:var(--accent);
    font-variant-numeric:tabular-nums; letter-spacing:-0.3px;
  }

  /* Form */
  .field { margin-bottom:8px; }
  .field label { display:block; font-size:12px; font-weight:500; color:var(--text-secondary); margin-bottom:5px; }
  .field input {
    width:100%; padding:9px 12px;
    background: var(--surface-solid);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    font-family:inherit; font-size:13px; color:var(--text-primary);
    outline:none; transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance:none;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
  }
  .field input::placeholder { color:var(--text-tertiary); }

  /* Buttons */
  .btn-primary {
    width:100%; padding:10px;
    background: var(--accent); color:#fff;
    border:none; border-radius:var(--radius-sm);
    font-family:inherit; font-size:13px; font-weight:500;
    cursor:pointer; transition: background 0.15s, opacity 0.15s, transform 0.1s;
    letter-spacing:-0.1px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-primary:active:not(:disabled) { transform: scale(0.98); }
  .btn-primary:disabled { opacity:0.35; cursor:default; }

  .btn-secondary {
    width:100%; padding:9px;
    background: transparent; color:var(--accent);
    border:1px solid rgba(0,113,227,0.25);
    border-radius:var(--radius-sm);
    font-family:inherit; font-size:13px; font-weight:500;
    cursor:pointer; transition: background 0.15s, border-color 0.15s;
    letter-spacing:-0.1px;
  }
  .btn-secondary:hover { background:var(--accent-light); border-color:rgba(0,113,227,0.4); }

  .btn-row { display:flex; gap:8px; margin-top:8px; }
  .btn-row .btn-primary, .btn-row .btn-secondary { flex:1; width:auto; }

  /* List */
  #list-wrap { flex:1; overflow-y:auto; padding:14px 20px; }
  #list-wrap::-webkit-scrollbar { width:3px; }
  #list-wrap::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:2px; }

  .hs-item {
    display:flex; align-items:center; gap:10px;
    padding:10px 12px;
    background:var(--surface-solid);
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    margin-bottom:6px; cursor:pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .hs-item:hover { border-color:rgba(0,113,227,0.3); box-shadow:0 0 0 3px rgba(0,113,227,0.06); }
  .hs-dot { width:8px; height:8px; background:var(--success); border-radius:50%; flex-shrink:0; }
  .hs-info { flex:1; min-width:0; }
  .hs-name { font-size:13px; font-weight:500; color:var(--text-primary); }
  .hs-id { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
  .hs-del {
    background:none; border:none; color:var(--text-tertiary);
    font-size:17px; line-height:1; cursor:pointer; padding:2px 4px;
    border-radius:4px; transition:color 0.15s, background 0.15s;
  }
  .hs-del:hover { color:var(--danger); background:rgba(255,59,48,0.08); }

  /* Footer */
  .sb-footer { padding:14px 20px; border-top:1px solid var(--border); }

  /* Drop overlay */
  #drop-overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px;
    background: #e8e8ed; z-index:5;
    transition: opacity 0.3s;
  }
  #drop-overlay.hidden { opacity:0; pointer-events:none; }
  .drop-icon {
    width:60px; height:60px;
    background:rgba(0,113,227,0.08); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; margin-bottom:4px;
  }
  .drop-title { font-size:17px; font-weight:600; color:var(--text-primary); letter-spacing:-0.3px; }
  .drop-sub { font-size:13px; color:var(--text-secondary); }

  /* HUD coords */
  #hud-coords {
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px; padding:6px 16px;
    font-size:12px; color:var(--text-secondary);
    font-variant-numeric:tabular-nums;
    box-shadow:var(--shadow); pointer-events:none;
    opacity:0; transition:opacity 0.2s; white-space:nowrap;
  }
  #hud-coords.visible { opacity:1; }
  #hud-coords span { color:var(--accent); font-weight:500; }

  /* Click flash */
  #hud-click {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px; padding:6px 16px;
    font-size:12px; color:var(--text-secondary);
    box-shadow:var(--shadow); pointer-events:none;
    opacity:0; transition:opacity 0.3s;
  }
  #hud-click.visible { opacity:1; }

  /* Placed labels */
  .marker-label {
    position:absolute; pointer-events:none;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px);
    border:1px solid var(--border);
    border-radius:6px; padding:3px 8px;
    font-size:11px; font-weight:500; color:var(--text-primary);
    box-shadow:var(--shadow);
    transform:translate(-50%, -180%); white-space:nowrap;
    opacity:0; transition:opacity 0.2s;
  }

  /* Toast */
  #toast {
    position:fixed; bottom:20px; right:20px;
    background:var(--text-primary); color:#fff;
    font-size:13px; font-weight:500;
    padding:10px 16px; border-radius:10px;
    box-shadow:var(--shadow-lg);
    opacity:0; transform:translateY(6px);
    transition:opacity 0.2s, transform 0.2s;
    pointer-events:none; z-index:100;
  }
  #toast.show { opacity:1; transform:translateY(0); }
</style>
</head>
<body>
<div id="app">

  <div id="sidebar">
    <div class="sb-top">
      <div class="app-label">Room Editor</div>
      <div class="app-title">Hotspot Editor</div>
    </div>

    <div class="sb-section">
      <div class="section-label">Model 3D</div>
      <label class="file-btn" for="file-glb">
        <div class="file-icon">📦</div>
        <div class="file-info">
          <div class="file-info-name" id="glb-name">Seleccionar room.glb</div>
          <div class="file-info-sub">Model exportat de Polycam</div>
        </div>
      </label>
      <input type="file" id="file-glb" accept=".glb,.gltf,model/gltf-binary,model/gltf+json,application/octet-stream">
    </div>

    <div class="sb-section">
      <div class="section-label">Punt seleccionat</div>
      <div class="coord-group">
        <div class="coord-card"><div class="coord-axis">X</div><div class="coord-val" id="cx">—</div></div>
        <div class="coord-card"><div class="coord-axis">Y</div><div class="coord-val" id="cy">—</div></div>
        <div class="coord-card"><div class="coord-axis">Z</div><div class="coord-val" id="cz">—</div></div>
      </div>
    </div>

    <div class="sb-section">
      <div class="section-label">Nou Hotspot</div>
      <div class="field">
        <label>Identificador</label>
        <input type="text" id="in-id" placeholder="drawer_1">
      </div>
      <div class="field">
        <label>Etiqueta</label>
        <input type="text" id="in-label" placeholder="Calaix escriptori">
      </div>
      <div class="field">
        <label>Elements (separats per comes)</label>
        <input type="text" id="in-items" placeholder="cables, carregador">
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="btn-add" disabled>Afegir</button>
        <button class="btn-secondary" id="btn-copy-coord">Copiar coord</button>
      </div>
    </div>

    <div id="list-wrap">
      <div class="section-label" style="margin-bottom:10px;">
        Hotspots &nbsp;<span id="count" style="color:var(--accent);font-weight:700;">0</span>
      </div>
      <div id="hs-list"></div>
    </div>

    <div class="sb-footer">
      <button class="btn-primary" id="btn-export">Exportar hotspots.json</button>
    </div>
  </div>

  <div id="canvas-area">
    <div id="drop-overlay">
      <div class="drop-icon">📦</div>
      <div class="drop-title">Cap model carregat</div>
      <div class="drop-sub">Selecciona un fitxer .glb al panell esquerre</div>
    </div>
    <div id="hud-coords">
      x <span id="hx">0</span> &nbsp; y <span id="hy">0</span> &nbsp; z <span id="hz">0</span>
    </div>
    <div id="hud-click">📍 Punt seleccionat</div>
  </div>
</div>
<div id="toast"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let hotspots = [], selectedPoint = null, previewMesh = null;
let placedMeshes = [], labelEls = [], modelMeshes = [];

const area = document.getElementById('canvas-area');
const W = () => area.offsetWidth, H = () => area.offsetHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
area.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e8ed);

const camera = new THREE.PerspectiveCamera(50, W()/H(), 0.01, 200);
camera.position.set(4, 3, 5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;

scene.add(new THREE.AmbientLight(0xffffff, 1.8));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(6, 10, 6); sun.castShadow = true; scene.add(sun);
const fillLight = new THREE.DirectionalLight(0xd0e8ff, 0.5);
fillLight.position.set(-5, 3, -4);
scene.add(fillLight);

scene.add(new THREE.GridHelper(20, 40, 0xc8c8cc, 0xd8d8dc));

const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

const mkGeo = new THREE.SphereGeometry(0.04, 20, 20);
const mkPrev = new THREE.MeshPhongMaterial({ color:0x0071e3, emissive:0x003a80, emissiveIntensity:0.25 });
const mkPlace = new THREE.MeshPhongMaterial({ color:0x34c759, emissive:0x1a6b2e, emissiveIntensity:0.2 });

// DOM refs
const $ = id => document.getElementById(id);
const fileGlb=$('file-glb'), glbName=$('glb-name');
const inId=$('in-id'), inLabel=$('in-label'), inItems=$('in-items');
const btnAdd=$('btn-add'), btnCopy=$('btn-copy-coord'), btnExport=$('btn-export');
const hsList=$('hs-list'), countEl=$('count');
const cxEl=$('cx'), cyEl=$('cy'), czEl=$('cz');
const hxEl=$('hx'), hyEl=$('hy'), hzEl=$('hz');
const hudCoords=$('hud-coords'), hudClick=$('hud-click');
const overlay=$('drop-overlay'), toast=$('toast');

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}
const fmt = n => parseFloat(n.toFixed(4));
const fS  = n => n.toFixed(3);

// Converts a GLB ArrayBuffer into a GLTF JSON string with all embedded
// images and the binary buffer replaced by data URIs, so Three.js never
// needs to create or fetch blob: URLs (which fail in some environments).
async function preprocessGLB(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  let offset = 12, gltfJson = null, binBuffer = null;
  while (offset < arrayBuffer.byteLength) {
    const len  = view.getUint32(offset, true);
    const type = view.getUint32(offset + 4, true);
    const data = arrayBuffer.slice(offset + 8, offset + 8 + len);
    if      (type === 0x4E4F534A) gltfJson = JSON.parse(new TextDecoder().decode(data));
    else if (type === 0x004E4942) binBuffer = data;
    offset += 8 + len;
  }
  if (!gltfJson) throw new Error('GLB invàlid: no s\'ha trobat el chunk JSON');

  const toDataURL = (blob) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload  = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });

  // Convert each embedded image bufferView → data URI
  if (gltfJson.images && binBuffer) {
    gltfJson.images = await Promise.all(gltfJson.images.map(async img => {
      if (img.bufferView !== undefined) {
        const bv      = gltfJson.bufferViews[img.bufferView];
        const slice   = binBuffer.slice(bv.byteOffset || 0, (bv.byteOffset || 0) + bv.byteLength);
        const dataUrl = await toDataURL(new Blob([slice], { type: img.mimeType || 'image/jpeg' }));
        return { uri: dataUrl, mimeType: img.mimeType || 'image/jpeg' };
      }
      return img;
    }));
  }

  // Convert main binary buffer → data URI so Three.js doesn't fetch it
  if (binBuffer && gltfJson.buffers?.[0]) {
    gltfJson.buffers[0].uri = await toDataURL(
      new Blob([binBuffer], { type: 'application/octet-stream' })
    );
  }

  return JSON.stringify(gltfJson);
}

// Load GLB from file input
fileGlb.addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  glbName.textContent = file.name;
  // Remove old model
  scene.children.filter(c => c.userData.isModel).forEach(c => scene.remove(c));
  modelMeshes = [];
  try {
    const arrayBuffer = await file.arrayBuffer();
    const gltfString  = await preprocessGLB(arrayBuffer);
    new GLTFLoader().parse(gltfString, '', gltf => {
      const model = gltf.scene; model.userData.isModel = true;
      model.traverse(c => { if (c.isMesh) { c.castShadow=true; c.receiveShadow=true; modelMeshes.push(c); } });
      const box    = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      model.scale.setScalar(5 / Math.max(size.x, size.y, size.z));
      scene.add(model);
      camera.position.set(5, 4, 6); controls.target.set(0,0,0); controls.update();
      overlay.classList.add('hidden');
    }, err => {
      glbName.textContent = 'Seleccionar room.glb';
      showToast('Error carregant el model ✗');
      console.error(err);
    });
  } catch(err) {
    glbName.textContent = 'Seleccionar room.glb';
    showToast('Error llegint el fitxer ✗');
    console.error(err);
  }
});

// Click to pick
let mdPos = {x:0,y:0};
renderer.domElement.addEventListener('mousedown', e => { mdPos={x:e.clientX,y:e.clientY}; });
renderer.domElement.addEventListener('mouseup', e => {
  if (Math.hypot(e.clientX-mdPos.x, e.clientY-mdPos.y) > 5 || !modelMeshes.length) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(modelMeshes, false);
  if (!hits.length) return;
  const p = hits[0].point;
  selectedPoint = p.clone();
  cxEl.textContent = fS(p.x); cyEl.textContent = fS(p.y); czEl.textContent = fS(p.z);
  btnAdd.disabled = false;
  if (previewMesh) scene.remove(previewMesh);
  previewMesh = new THREE.Mesh(mkGeo, mkPrev.clone());
  previewMesh.position.copy(p); scene.add(previewMesh);
  hudClick.classList.add('visible');
  clearTimeout(hudClick._t); hudClick._t = setTimeout(() => hudClick.classList.remove('visible'), 1800);
});

// Hover
renderer.domElement.addEventListener('mousemove', e => {
  if (!modelMeshes.length) return;
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(modelMeshes, false);
  if (hits.length) {
    const p = hits[0].point;
    hxEl.textContent=fS(p.x); hyEl.textContent=fS(p.y); hzEl.textContent=fS(p.z);
    hudCoords.classList.add('visible');
    renderer.domElement.style.cursor='crosshair';
  } else {
    hudCoords.classList.remove('visible');
    renderer.domElement.style.cursor='default';
  }
});

// Add hotspot
btnAdd.addEventListener('click', () => {
  if (!selectedPoint) return;
  const id    = inId.value.trim()    || `hs_${hotspots.length+1}`;
  const label = inLabel.value.trim() || `Hotspot ${hotspots.length+1}`;
  const items = inItems.value.split(',').map(s=>s.trim()).filter(Boolean);
  const hs = { id, label, position:[fmt(selectedPoint.x),fmt(selectedPoint.y),fmt(selectedPoint.z)], items };
  hotspots.push(hs);
  if (previewMesh) {
    previewMesh.material = mkPlace.clone();
    previewMesh.userData = { label };
    placedMeshes.push(previewMesh);
    const el = document.createElement('div');
    el.className = 'marker-label'; el.textContent = label;
    area.appendChild(el);
    labelEls.push({ mesh: previewMesh, el });
    previewMesh = null;
  }
  selectedPoint = null; btnAdd.disabled = true;
  cxEl.textContent=cyEl.textContent=czEl.textContent='—';
  inId.value=inLabel.value=inItems.value='';
  renderList(); showToast('Hotspot afegit ✓');
});

btnCopy.addEventListener('click', () => {
  if (!selectedPoint && !hotspots.length) return;
  let p = selectedPoint
    ? {x:fmt(selectedPoint.x),y:fmt(selectedPoint.y),z:fmt(selectedPoint.z)}
    : { x:hotspots.at(-1).position[0], y:hotspots.at(-1).position[1], z:hotspots.at(-1).position[2] };
  navigator.clipboard.writeText(JSON.stringify(p,null,2)).then(() => showToast('Coordenada copiada ✓'));
});

btnExport.addEventListener('click', () => {
  if (!hotspots.length) { showToast('Cap hotspot per exportar'); return; }
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([JSON.stringify(hotspots,null,2)],{type:'application/json'})),
    download: 'hotspots.json'
  });
  a.click(); showToast('hotspots.json descarregat ✓');
});

function renderList() {
  countEl.textContent = hotspots.length;
  hsList.innerHTML = hotspots.map((hs,i) => `
    <div class="hs-item">
      <div class="hs-dot"></div>
      <div class="hs-info">
        <div class="hs-name">${hs.label}</div>
        <div class="hs-id">${hs.id} · [${hs.position.join(', ')}]</div>
      </div>
      <button class="hs-del" data-i="${i}">×</button>
    </div>`).join('');
  hsList.querySelectorAll('.hs-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      if (placedMeshes[i]) { scene.remove(placedMeshes[i]); placedMeshes.splice(i,1); }
      if (labelEls[i]) { labelEls[i].el.remove(); labelEls.splice(i,1); }
      hotspots.splice(i,1); renderList();
    });
  });
}

function updateLabels() {
  labelEls.forEach(({mesh,el}) => {
    const pos = mesh.position.clone().project(camera);
    const x = (pos.x*.5+.5)*W(), y = (-pos.y*.5+.5)*H();
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.opacity = pos.z < 1 ? '1' : '0';
  });
}

window.addEventListener('resize', () => {
  camera.aspect=W()/H(); camera.updateProjectionMatrix(); renderer.setSize(W(),H());
});

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (previewMesh) previewMesh.scale.setScalar(1 + 0.07*Math.sin(t*4));
  controls.update(); updateLabels(); renderer.render(scene, camera);
})();
</script>
</body>
</html>
